services:
  code-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CODE_SERVER_BASE_IMAGE: ghcr.io/coder/code-server:${CODE_SERVER_VERSION:-latest}
        UV_VERSION: "${UV_VERSION:-latest}"
        CLAUDE_CODE_VERSION: "${CLAUDE_CODE_VERSION:-latest}"
        CODEX_CLI_VERSION: "${CODEX_CLI_VERSION:-latest}"
        OPENCODE_CLI_VERSION: "${OPENCODE_CLI_VERSION:-latest}"
    image: "${CODE_SERVER_IMAGE:-oia-code-server:local}"
    restart: unless-stopped
    init: true
    user: "${CODE_SERVER_UID:-1000}:${CODE_SERVER_GID:-1000}"
    environment:
      PASSWORD: "${CODE_SERVER_PASSWORD:?Set CODE_SERVER_PASSWORD in .env}"
      TZ: "${TZ:-UTC}"
      DOCKER_USER: "${DOCKER_USER:-coder}"
      CODE_SERVER_THEME: "${CODE_SERVER_THEME:-Default Dark Modern}"
      VSCODE_EXTENSIONS: "${VSCODE_EXTENSIONS:-ms-python.python,ms-python.vscode-pylance,charliermarsh.ruff,esbenp.prettier-vscode,dbaeumer.vscode-eslint,redhat.vscode-yaml,yzhang.markdown-all-in-one}"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.code-server.rule=PathPrefix(`/code/`)
      - traefik.http.routers.code-server.middlewares=code-server-strip
      - traefik.http.middlewares.code-server-strip.stripprefix.prefixes=/code
      - traefik.http.services.code-server.loadbalancer.server.port=8080
      - traefik.http.routers.code-server-slash.rule=Path(`/code`)
      - traefik.http.routers.code-server-slash.priority=100
      - traefik.http.routers.code-server-slash.middlewares=code-server-slash
      - traefik.http.middlewares.code-server-slash.redirectregex.regex=^(.*)/code$
      - traefik.http.middlewares.code-server-slash.redirectregex.replacement=$${1}/code/
      - traefik.http.middlewares.code-server-slash.redirectregex.permanent=true
    volumes:
      # Grants control of the host Docker daemon from inside code-server
      # (e.g. `docker compose up -d --build` for other projects under
      # projects/). This is powerful, host-level access. Defaults to the
      # standard rootful socket; on a host running rootless Docker, point
      # this at that daemon's socket instead (usually
      # /run/user/<uid>/docker.sock — check with `docker context ls`) and
      # set CODE_SERVER_UID/CODE_SERVER_GID to that same uid/gid so the
      # container's own uid matches the socket's owner. No group_add or
      # root/sudo tricks needed either way: Unix socket permissions are
      # just a uid/gid match.
      - "${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock"
      # Persist code-server and coding-agent settings, credentials, extensions,
      # and git configuration across image rebuilds/container recreation.
      # Override the host path when the default directory is not writable.
      - "${CODE_SERVER_HOME_PATH:-./data/home}:/home/coder"
      # The directory opened by default in the browser
      - "${CODE_SERVER_WORKSPACE_PATH:-./workspace}:/home/coder/project"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  proxy:
    external: true
    name: proxy
