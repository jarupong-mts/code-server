# Optional override for hosts without Traefik: publishes code-server directly on
# CODE_SERVER_BIND_IP:CODE_SERVER_PORT. Selected through COMPOSE_FILE in .env,
# which `make up` writes after asking how code-server should be reached.
services:
  code-server:
    ports:
      - "${CODE_SERVER_BIND_IP:-0.0.0.0}:${CODE_SERVER_PORT:-8080}:8080"
